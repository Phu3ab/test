  top: 0;

  overflow-x: auto;
  gap: 4px;
  padding: 4px 10px 8px;

  flex: none;
  background: var(--c);
  color: var(--m);
  border: 1px solid var(--b);
  border-radius: 18px;
  padding: 7px 14px;
  font: inherit;
}

  background: var(--a2);
  color: #10141f;
  border-color: var(--a2);
  font-weight: 600;
}
main {
  padding: 10px 12px 40px;
  max-width: 900px;
  margin: auto;
}
input,
select,
textarea {
  background: var(--in);
  color: var(--t);
  border: 1px solid var(--b);
  border-radius: 8px;
  padding: 8px;
  font: inherit;
  width: 100%;
}
.card {
  background: var(--c);
  border: 1px solid var(--b);
  border-radius: 10px;
  padding: 10px 12px;
  margin: 8px 0;
}
.row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}
.m {
  color: var(--m);
  font-size: 13px;
}
.e {
  color: var(--a2);
  font-weight: 700;
  font-size: 17px;
}
.g {
  display: grid;
  grid-template-columns: 1fr 90px;
  gap: 6px 10px;
  align-items: center;
}
button.s {
  background: var(--a);
  color: #1a1f2e;
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  font: inherit;
  font-weight: 600;
}
.pos {
  color: #7fc79a;
}
.neg {
  color: #e07856;
}
h2 {
  font-size: 1rem;
  margin: 16px 0 6px;
  color: var(--a2);
}
.it {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--b);
}
.it .row {
  font-size: 13px;
  line-height: 1.5;
}
.card.sel {
  border-color: var(--a2);
  box-shadow: 0 0 0 1px var(--a2);
}
.pick {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

  font-size: 11px;
  padding: 1px 7px;

  border: 1px solid var(--b);
  background: var(--in);
  color: var(--m);

  border-color: var(--a2);

}

}

// Deutsche Item-Namen (Englisch -> Deutsch): ITM (data/ITM.js), ITX (i18n/items.js) + Regeln für Kits, Einheiten, Boosts.
// Gemeinsam genutzt von foeff.html und city.html. Liefert itd(englischerName) -> deutscher Name oder null.
const ITX = I18N.items.ITX;
function itd(k) {
  if (ITM[k]) return ITM[k];
  if (ITX[k]) return ITX[k];
  let x;
  if ((x = /^(.*?)(?:(Golden|Silver|Platinum) )?(Selection|Upgrade) Kit$/.exec(k))) {
    const m = { Golden: "Gold-", Silver: "Silber-", Platinum: "Platin-" };
    return x[1] + (x[2] ? m[x[2]] : "") + (x[3] === "Selection" ? "Auswahl-Kit" : "Upgrade-Kit");
  }
  if ((x = /^\[Unit Type( NextEra)?\] (.+)$/.exec(k)))
    return (
      "Einheit: " +
      ({
        Fast: "Schnell",
        Heavy: "Schwer",
        Light: "Leicht",
        Artillery: "Artillerie",
        Ranged: "Fernkämpfer",
        Random: "Zufällig",
        Champion: "Held",
        "Color Guard": "Fahnenwache",
        "Military Drummer": "Militär-Trommler",
        Rogue: "Agent",
      }[x[2]] || x[2]) +
      (x[1] ? " (nächstes)" : "")
    );
  if ((x = /^(\d+)% Coin Boost$/.exec(k))) return x[1] + "% Münz-Bonus";
  if ((x = /^(\d+(?:h|min)) Mass (Coin|Supply) Rush$/.exec(k)))
    return x[1] + " Massen-" + (x[2] === "Coin" ? "Münz" : "Vorrats") + "-Eile";
  if ((x = /^(\d+)% (Attack|Defense) for (Attacking|Defending) Army Boost$/.exec(k)))
    return (
      x[1] +
      "% " +
      (x[2] === "Attack" ? "Angriff" : "Verteidigung") +
      " für " +
      (x[3] === "Attacking" ? "angreifende" : "verteidigende") +
      " Armee"
    );
  if ((x = /^Trading Post - Lv\. (\d+)$/.exec(k))) return "Handelsposten - Stufe " + x[1];
  return null;
}
</script><script>
// Schlüssel-basierte Übersetzung: createT(texts, getLang) -> t(key, params).
// texts = { "bereich.name": { en: "…", de: "…" } }, Platzhalter {name} werden aus params ersetzt.
// Fehlender Schlüssel: der Schlüssel selbst wird angezeigt und in der Konsole gemeldet; fehlende Sprache fällt auf en zurück.
function createT(texts, getLang) {
  return function t(key, params) {
