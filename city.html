<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>City Planner</title>
<style>
:root {
  --bg: #1a1f2e;
  --panel: #232a3d;
  --accent: #d4a94b;
  --blue: #6fa8dc;
  --text: #e8e6df;
  --muted: #8a92a6;
  --border: #333d54;
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
}
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font:
    13px system-ui,
    sans-serif;
}
button,
select,
input {
  background: #10141f;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font: inherit;
}
button.on {
  background: var(--accent);
  color: #1a1f2e;
  font-weight: 700;
}
#top {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 6px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
#wrap {
  flex: 1;
  overflow: auto;
  min-height: 80px;
  background: #000;
}
canvas {
  display: block;
}
#st {
  padding: 3px 8px;
  color: var(--muted);
  font-size: 12px;
  background: var(--panel);
  min-height: 22px;
}
#bot {
  max-height: 40vh;
  overflow: auto;
  background: var(--panel);
  border-top: 1px solid var(--border);
}
details {
  padding: 4px 8px;
}
summary {
  cursor: pointer;
  color: var(--blue);
  font-weight: 600;
  padding: 4px 0;
}
#pal {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
#pal button {
  text-align: left;
  font-size: 12px;
}
#pal button:disabled {
  opacity: 0.35;
}
table {
  width: 100%;
  border-collapse: collapse;
}
td {
  padding: 2px 4px;
  border-bottom: 1px solid var(--border);
}
td + td {
  text-align: right;
}
.g {
  color: #e07a7a;
}

#tgs {
  display: flex;
  gap: 4px;
  padding: 4px 6px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
#tgs button {
  flex: 1;
  padding: 3px 6px;
  font-size: 12px;
}
#tgs button::before {
  content: "▾ ";
}
#tgs button.col::before {
  content: "▸ ";
}
.hid {
  display: none !important;
}
</style></head><body>

// Deutsche Item-Namen (Englisch -> Deutsch): ITM (data/ITM.js), ITX (i18n/items.js) + Regeln für Kits, Einheiten, Boosts.
// Gemeinsam genutzt von foeff.html und city.html. Liefert itd(englischerName) -> deutscher Name oder null.
const ITX = I18N.items.ITX;
function itd(k) {
  if (ITM[k]) return ITM[k];
  if (ITX[k]) return ITX[k];
  let x;
  if ((x = /^(.*?)(?:(Golden|Silver|Platinum) )?(Selection|Upgrade) Kit$/.exec(k))) {
    const m = { Golden: "Gold-", Silver: "Silber-", Platinum: "Platin-" };
    return x[1] + (x[2] ? m[x[2]] : "") + (x[3] === "Selection" ? "Auswahl-Kit" : "Upgrade-Kit");
  }
  if ((x = /^\[Unit Type( NextEra)?\] (.+)$/.exec(k)))
    return (
      "Einheit: " +
      ({
        Fast: "Schnell",
        Heavy: "Schwer",
        Light: "Leicht",
        Artillery: "Artillerie",
        Ranged: "Fernkämpfer",
        Random: "Zufällig",
        Champion: "Held",
        "Color Guard": "Fahnenwache",
        "Military Drummer": "Militär-Trommler",
        Rogue: "Agent",
      }[x[2]] || x[2]) +
      (x[1] ? " (nächstes)" : "")
    );
  if ((x = /^(\d+)% Coin Boost$/.exec(k))) return x[1] + "% Münz-Bonus";
  if ((x = /^(\d+(?:h|min)) Mass (Coin|Supply) Rush$/.exec(k)))
    return x[1] + " Massen-" + (x[2] === "Coin" ? "Münz" : "Vorrats") + "-Eile";
  if ((x = /^(\d+)% (Attack|Defense) for (Attacking|Defending) Army Boost$/.exec(k)))
    return (
      x[1] +
      "% " +
      (x[2] === "Attack" ? "Angriff" : "Verteidigung") +
      " für " +
      (x[3] === "Attacking" ? "angreifende" : "verteidigende") +
      " Armee"
    );
  if ((x = /^Trading Post - Lv\. (\d+)$/.exec(k))) return "Handelsposten - Stufe " + x[1];
  return null;
}
</script><script>
// Schlüssel-basierte Übersetzung: createT(texts, getLang) -> t(key, params).
// texts = { "bereich.name": { en: "…", de: "…" } }, Platzhalter {name} werden aus params ersetzt.
// Fehlender Schlüssel: der Schlüssel selbst wird angezeigt und in der Konsole gemeldet; fehlende Sprache fällt auf en zurück.
function createT(texts, getLang) {
  return function t(key, params) {
    const e = texts[key];
    if (!e) {
      console.warn("i18n: fehlender Schlüssel", key);
      return key;
    }
    const s = e[getLang()] != null ? e[getLang()] : e.en;
    return params ? s.replace(/\{(\w+)\}/g, (m, k) => (k in params ? params[k] : m)) : s;
  };
}
</script><script>

function palette() {

      M = d.CityMapData || d.cityData,

    const u = maxB.map((_, b) => isMin(b));

        y = a.y || 0;
