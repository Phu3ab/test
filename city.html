<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>City Planner</title>
<style>
:root {
  --bg: #1a1f2e;
  --panel: #232a3d;
  --accent: #d4a94b;
  --blue: #6fa8dc;
  --text: #e8e6df;
  --muted: #8a92a6;
  --border: #333d54;
  --in: #10141f;
  --t: var(--text);
  --b: var(--border);
  --m: var(--muted);
  --c: var(--panel);
  --a: var(--accent);
  --a2: var(--blue);
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
}
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font:
    13px system-ui,
    sans-serif;
}
button,
select,
input {
  background: #10141f;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font: inherit;
}
button.on {
  background: var(--accent);
  color: #1a1f2e;
  font-weight: 700;
}
#top {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 6px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
#wrap {
  flex: 1;
  overflow: auto;
  min-height: 80px;
  background: #000;
}
canvas {
  display: block;
}
#st {
  padding: 3px 8px;
  color: var(--muted);
  font-size: 12px;
  background: var(--panel);
  min-height: 22px;
}
#bot {
  max-height: 40vh;
  overflow: auto;
  background: var(--panel);
  border-top: 1px solid var(--border);
}
details {
  padding: 4px 8px;
}
summary {
  cursor: pointer;
  color: var(--blue);
  font-weight: 600;
  padding: 4px 0;
}
#pal {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
#pal button {
  text-align: left;
  font-size: 12px;
}
#pal button:disabled {
  opacity: 0.35;
}
table {
  width: 100%;
  border-collapse: collapse;
}
td {
  padding: 2px 4px;
  border-bottom: 1px solid var(--border);
}
td + td {
  text-align: right;
}
.g {
  color: #e07a7a;
}

.tgb {
  padding: 2px 10px;
  font-size: 12px;
  line-height: 1.2;
}
#ttl {
  display: flex;
  align-items: center;
  gap: 8px;
}
#botbar {
  flex: none;
  display: flex;
  justify-content: center;
  padding: 2px 6px;
  background: var(--panel);
  border-top: 1px solid var(--border);
}
.hid {
  display: none !important;
}
/* Auswahl-Knöpfe in der Werkzeugleiste klein und inline lassen */
#era + button.pk,
#erasel + button.pk,
#strsel + button.pk,
#cat + button.pk {
  width: auto;
  max-width: 100%;
}
#cat + button.pk {
  flex: 1;
  min-width: 0;
}
#ttl {
  flex: none;
  padding: 10px 76px 4px 14px;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.5px;
}
#ttl #era + button.pk {
  margin-left: auto;
}

/* Animationen (werden bei „Bewegung reduzieren“ des Systems abgeschaltet) */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.96) translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (prefers-reduced-motion: no-preference) {
  button,
  select,
  input,
  .group-chip {
    transition:
      transform 0.12s ease,
      background-color 0.2s ease,
      border-color 0.2s ease,
      color 0.2s ease,
      box-shadow 0.2s ease,
      opacity 0.2s ease;
  }
  button:active {
    transform: scale(0.96);
  }
  input:focus,
  select:focus {
    box-shadow: 0 0 0 2px rgba(212, 169, 75, 0.35);
  }
}

/* Ein-/Ausklappen animiert (Chrome: interpolate-size; sonst springt es wie vorher) */
@media (prefers-reduced-motion: no-preference) {
  :root {
    interpolate-size: allow-keywords;
  }
  .panel-body,
  .go-body {
    overflow: hidden;
    height: auto;
    transition:
      height 0.3s ease,
      opacity 0.25s ease,
      visibility 0.3s;
  }
  .panel.collapsed .panel-body,
  .group-output-panel.collapsed .go-body {
    display: block;
    height: 0;
    opacity: 0;
    visibility: hidden;
    margin: 0;
    padding-top: 0;
    padding-bottom: 0;
  }
  details::details-content {
    block-size: 0;
    overflow: hidden;
    opacity: 0;
    transition:
      block-size 0.3s ease,
      opacity 0.25s ease,
      content-visibility 0.3s allow-discrete;
  }
  details[open]::details-content {
    block-size: auto;
    opacity: 1;
  }
}
</style><style>
/* Gemeinsame Auswahl (js/pick.js). Erwartet die Variablen --in --t --b --m --c --a --a2 der Seite. */
button.pk {
  background: var(--in);
  color: var(--t);
  border: 1px solid var(--b);
  border-radius: 8px;
  padding: 8px 26px 8px 10px;
  font:
    15px Segoe UI,
    system-ui,
    sans-serif;
  text-align: left;
  width: 100%;
  min-width: 0;
  position: relative;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
button.pk::after {
  content: "▾";
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--m);
}
.pkov {
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.pksh {
  width: 100%;
  max-width: 600px;
  max-height: 85vh;
  overflow: auto;
  margin: 0;
  border-radius: 14px 14px 0 0;
  padding-top: 0;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
}
.pkh {
  position: sticky;
  top: 0;
  background: var(--c);
  padding: 12px 0 6px;
  z-index: 1;
}
.pkr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 11px 4px;
  border-bottom: 1px solid var(--b);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pkr.on {
  color: var(--a2);
  font-weight: 600;
}
.pkr .ck {
  flex: none;
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--m);
  border-radius: 50%;
  position: relative;
}
.pkr.mu .ck {
  border-radius: 5px;
}
.pkr.on .ck {
  background: var(--a2);
  border-color: var(--a2);
}
.pkr.on .ck::after {
  content: "✓";
  position: absolute;
  inset: 0;
  text-align: center;
  line-height: 18px;
  font-size: 14px;
  font-style: normal;
  font-weight: 700;
  color: #10141f;
}
.pkt {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.pkn {
  color: var(--m);
  padding: 10px 4px;
}
.pkh .pkt button.s {
  background: var(--a);
  color: #1a1f2e;
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  font: inherit;
  font-weight: 600;
}
.pksh h2 {
  font-size: 1rem;
  margin: 14px 0 4px;
  color: var(--a2);
}
.pksh.card {
  background: var(--c);
  border: 1px solid var(--b);
  color: var(--t);
  padding-left: 12px;
  padding-right: 12px;
}
/* Sprachwahl: auf jeder Seite gleiche Position und Größe (oben rechts) */
button.lgpk {
  position: fixed;
  top: 8px;
  right: 10px;
  z-index: 30;
  width: 58px;
  height: 30px;
  margin: 0;
  padding: 0 18px 0 9px;
  font-size: 0.85rem;
  font-weight: 400;
  letter-spacing: 0;
  line-height: 28px;
  border-radius: 6px;
}
button.lgpk::after {
  right: 7px;
}
.pkov {
  z-index: 3000;
}
/* Zeitalter-Knopf: gleiche Höhe und Schrift wie die Sprachwahl */
#era + button.pk {
  max-width: 34vw;
  height: 30px;
  padding-top: 0;
  padding-bottom: 0;
  line-height: 28px;
  font-size: 0.85rem;
  font-weight: 400;
  border-radius: 6px;
}
/* Kurze Listen und Kalender: Dialog in der Mitte */
.pkov.mid {
  align-items: center;
  padding: 16px;
}
.pkov.mid .pksh {
  max-width: 340px;
  max-height: 80vh;
  border-radius: 14px;
  padding-bottom: 12px;
}
.pkcal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 10px;
  text-align: center;
}
.pkcal .wd {
  color: var(--m);
  font-size: 12px;
  padding: 2px 0;
}
button.pkd {
  background: var(--in);
  color: var(--t);
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 8px 0;
  font: inherit;
}
button.pkd.td {
  border-color: var(--a2);
}
button.pkd.on {
  background: var(--a2);
  color: #10141f;
  font-weight: 700;
}
.pkb .pkt button.s {
  background: var(--in);
  color: var(--t);
  border: 1px solid var(--b);
  border-radius: 8px;
  padding: 4px 14px;
  font: inherit;
  font-size: 1.2rem;
}
/* Einheitliche Schrift in allen Auswahl-Dialogen (wie Effizienz), unabhängig von der Seite */
.pkov,
.pkov input,
.pkov button {
  font-family:
    Segoe UI,
    system-ui,
    sans-serif;
  font-size: 15px;
  line-height: normal;
  letter-spacing: 0;
}
.pkov {
  color: var(--t);
  font-weight: 400;
}
.pkov .pkcal .wd {
  font-size: 12px;
}
.pkov b {
  font-weight: 700;
}
.pkov .pkr.on {
  font-weight: 600;
}
/* Zeitwähler (pkTime) */
.pkh6 {
  grid-template-columns: repeat(6, 1fr);
}
.pktm {
  text-align: center;
  font-size: 2rem;
  letter-spacing: 2px;
  margin-top: 6px;
}
.pkb .pkh6 + .pkh6 {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--b);
}
.pkfine {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 12px;
}
.pkb .pkfine button.s {
  background: var(--in);
  color: var(--t);
  border: 1px solid var(--b);
  border-radius: 8px;
  padding: 8px 14px;
  font: inherit;
}
button.pk.tm {
  width: auto;
  min-width: 78px;
  text-align: center;
  padding-left: 10px;
}

@keyframes pkIn {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes pkFade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: no-preference) {
  .pkov {
    animation: pkFade 0.2s ease both;
  }
  .pksh {
    animation: pkIn 0.25s ease both;
  }
}
</style></head><body>
